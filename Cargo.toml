[package]
name = "pastvideo"
version = "0.1.0"
edition = "2021"
description = "A Rust video-search database: index footage, search by text or image"
license = "Apache-2.0"
repository = "https://github.com/flow/pastvideo"

[lib]
name = "pastvideo"
path = "src/lib.rs"

[[bin]]
name = "pastvideo"
path = "src/bin/pastvideo.rs"

[[bin]]
name = "pastvideo-desktop"
path = "src/bin/pastvideo_desktop.rs"

[features]
default = []

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
base64 = "0.23"
dirs = "6"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
opener = "0.8"
rfd = "0.17"

[dev-dependencies]
